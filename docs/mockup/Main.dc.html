.cell{box-sizing:border-box;display:flex;align-items:flex-start;justify-content:flex-start;padding:2px 0 0 3px;font-family:'Nunito',system-ui,sans-serif;font-weight:800;font-size:10px;line-height:1;color:#244a1a;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),inset 0 -2px 0 rgba(0,0,0,.08)}
.cell.a{background:linear-gradient(135deg,#cdeb94,#b0da70)}
.cell.b{background:linear-gradient(135deg,#97d462,#7fc24c)}
.cell.start{background:linear-gradient(135deg,#2fa84a,#1f8a38);color:#ffffff;font-size:8px;align-items:center;justify-content:center;padding:0;letter-spacing:.3px}
.cell.finish{background:linear-gradient(135deg,#ffe27a,#f5b82e);color:#5a3a00}
.logo{font-family:'Lilita One','Nunito',system-ui,sans-serif;font-size:62px;line-height:.95;letter-spacing:1px;text-shadow:3px 0 0 #17492a,-3px 0 0 #17492a,0 3px 0 #17492a,0 -3px 0 #17492a,2px 2px 0 #17492a,-2px 2px 0 #17492a,2px -2px 0 #17492a,-2px -2px 0 #17492a,0 7px 0 #0b2e18,0 11px 12px rgba(0,0,0,.28)}
.disp{font-family:'Lilita One','Nunito',system-ui,sans-serif}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-1.4px) scale(1.012,1.03)}}
@keyframes wave{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-20deg)}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.9}}
@keyframes toss{0%,100%{transform:translate(4px,-34px) rotate(24deg)}50%{transform:translate(6px,-44px) rotate(40deg)}}
.bob{transform-origin:20px 45px;animation:bob 2.6s ease-in-out infinite}
.wave{transform-origin:30px 24px;animation:wave 1.9s ease-in-out infinite}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.toss{animation:toss 1.1s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob,.wave,.pulse,.toss{animation:none}}
</style>
</helmet>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const cells = [];
    for (let rt = 0; rt < 10; rt++) {
      const r = 9 - rt;
      for (let col = 0; col < 10; col++) {
        const n = r * 10 + (r % 2 === 0 ? col + 1 : 10 - col);
        let tone = (r + col) % 2 === 0 ? 'a' : 'b';
        let label = String(n);
        if (n === 1) { tone += ' start'; label = 'MULAI'; }
        if (n === 100) { tone += ' finish'; }
        cells.push({ n, tone, label });
      }
    }
    return { cells };
  }
}
</script>
